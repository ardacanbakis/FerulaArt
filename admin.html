<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ferula Art — CMS Login</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="login-page">

  <!-- Left art panel -->
  <div class="login-art" aria-hidden="true">
    <div class="art-gradient"></div>
    <div class="art-orbs">
      <div class="art-orb o1"></div>
      <div class="art-orb o2"></div>
      <div class="art-orb o3"></div>
    </div>
    <div class="art-content">
      <div class="art-logo">
        <span class="art-diamond">✦</span>
        <span>Ferula Art</span>
      </div>
      <p class="art-tagline">El sanatının<br/><em>dijital kalbi.</em></p>
      <div class="art-chips">
        <span>✦ Takı</span>
        <span>✦ Dekor</span>
        <span>✦ Kağıt Sanatı</span>
        <span>✦ Tekstil</span>
      </div>
    </div>
    <div class="art-footer">
      <a href="index.html">← Siteye Dön</a>
    </div>
  </div>

  <!-- Right login form -->
  <div class="login-form-side">
    <div class="login-card">
      <div class="login-header">
        <h1>CMS Girişi</h1>
        <p>Yönetim paneline erişmek için giriş yapın.</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="field-group">
          <label for="email">E-posta</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22,7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2,7"/></svg>
            <input type="email" id="email" placeholder="admin@ferulaart.com"
                   required autocomplete="email" spellcheck="false" />
          </div>
        </div>

        <div class="field-group">
          <label for="password">Şifre</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" placeholder="••••••••"
                   required autocomplete="current-password" />
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="Şifreyi göster">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <p class="login-error" id="loginError" role="alert" aria-live="polite"></p>

        <button type="submit" class="btn-signin" id="loginBtn">
          <span class="btn-label">Giriş Yap</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
      </form>

      <div class="login-footer">
        <a href="index.html">← Siteye Dön</a>
      </div>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
